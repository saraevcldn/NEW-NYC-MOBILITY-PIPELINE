resources:
  jobs:
    nyc_mobility_pipeline:

      name: NYC Mobility Pipeline

      # MONTHLY SCHEDULE
      # Runs at 2:00 AM on the 1st day of every month
      schedule:
        quartz_cron_expression: "0 0 2 1 * ?"
        timezone_id: "Asia/Manila"
        pause_status: UNPAUSED

      # FAILURE EMAIL NOTIFICATIONS
      email_notifications:
        on_failure:
          - razzelle.boreros@ftwfoundation.org
          - sara.celadina@ftwfoundation.org
          - maeve.lumague@ftwfoundation.org
          - tricia.taneo@ftwfoundation.org
          - alleanna.villan@ftwfoundation.org

      # SERVERLESS PYTHON ENVIRONMENT

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      # PIPELINE TASKS

      tasks:

        # 00 - SETUP

        - task_key: init_schemas

          sql_task:
            file:
              path: ../src/sql/00_setup/00_init_schemas.sql
            warehouse_id: 8414776a94d0039f


        - task_key: download_green_taxi

          depends_on:
            - task_key: init_schemas

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/00_setup/download_green_taxi_incremental.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        - task_key: download_taxi_zones

          depends_on:
            - task_key: init_schemas

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/00_setup/download_taxi_zones.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        # 01 - BRONZE INGESTION

        - task_key: ingest_green_taxi

          depends_on:
            - task_key: download_green_taxi

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/01_bronze_ingest/ingest_green_taxi_idempotent.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        - task_key: ingest_taxi_zones

          depends_on:
            - task_key: download_taxi_zones

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/01_bronze_ingest/ingest_taxi_zones.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        # 02 - SILVER CLEANING

        - task_key: clean_green_taxi

          depends_on:
            - task_key: ingest_green_taxi

          sql_task:
            file:
              path: ../src/sql/02_silver_clean/clean_green_taxi.sql
            warehouse_id: 8414776a94d0039f


        - task_key: clean_taxi_zones

          depends_on:
            - task_key: ingest_taxi_zones

          sql_task:
            file:
              path: ../src/sql/02_silver_clean/clean_taxi_zones.sql
            warehouse_id: 8414776a94d0039f


        # ==========================================
        # 03 - GOLD MODEL

        - task_key: dim_datetime

          depends_on:
            - task_key: init_schemas

          sql_task:
            file:
              path: ../src/sql/03_gold_model/dim_datetime.sql
            warehouse_id: 8414776a94d0039f


        - task_key: dim_location

          depends_on:
            - task_key: check_taxi_zones

          sql_task:
            file:
              path: ../src/sql/03_gold_model/dim_location.sql
            warehouse_id: 8414776a94d0039f


        # fact_taxi_trip_dlt replaces fact_taxi_trip in this job's pipeline —
        # joined to dim_weather_dlt instead of dim_weather. The original
        # fact_taxi_trip.sql file/table is untouched and still exists in the
        # repo, it's just no longer run as part of this job.
        - task_key: fact_taxi_trip_dlt

          depends_on:
            - task_key: check_green_taxi
            - task_key: dim_datetime
            - task_key: dim_location
            - task_key: dim_weather_dlt

          sql_task:
            file:
              path: ../src/sql/03_gold_model/fact_taxi_trip_dlt.sql
            warehouse_id: 8414776a94d0039f

        # ==========================================
        # 04 - DATA QUALITY
        
        # Data Quality Checks
        - task_key: check_green_taxi

          depends_on:
            - task_key: clean_green_taxi

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/04_data_quality/02_clean_checks/check_clean_green_taxi.py

        - task_key: check_taxi_zones

          depends_on:
            - task_key: clean_taxi_zones

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/04_data_quality/02_clean_checks/check_clean_taxi_zone.py

        - task_key: check_weather

          depends_on:
            - task_key: clean_weather_dlt

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/04_data_quality/02_clean_checks/check_clean_weather.py
        
        # QUARANTINE

        - task_key: quarantine_green_taxi

          depends_on:
            - task_key: check_green_taxi

          run_if: ALL_DONE
          
          sql_task:
            file:
              path: ../src/sql/04_data_quality/04_quarantine_tables/green_taxi_quarantine.sql
            warehouse_id: 8414776a94d0039f


        - task_key: quarantine_taxi_zones

          depends_on:
            - task_key: check_taxi_zones

          run_if: ALL_DONE
          
          sql_task:
            file:
              path: ../src/sql/04_data_quality/04_quarantine_tables/taxi_zone_quarantine.sql
            warehouse_id: 8414776a94d0039f


        - task_key: quarantine_weather

          depends_on:
            - task_key: check_weather
          
          run_if: ALL_DONE
          
          sql_task:
            file:
              path: ../src/sql/04_data_quality/04_quarantine_tables/weather_quarantine.sql
            warehouse_id: 8414776a94d0039f


        # DQ WARN MONITORING

        - task_key: monitor_dq_warnings

          depends_on:
            - task_key: check_green_taxi
            - task_key: check_taxi_zones
            - task_key: check_weather

          sql_task:
            file:
              path: ../src/sql/04_data_quality/05_warn_monitoring/01_monitor_dq_warnings.sql
            warehouse_id: 8414776a94d0039f


        - task_key: alert_dq_warnings

          depends_on:
            - task_key: monitor_dq_warnings

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/04_data_quality/05_warn_monitoring/02_alert_dq_warnings.py
        
        # ==========================================
        # 05 - ANALYTICS

        - task_key: taxi_demand

          depends_on:
            - task_key: fact_taxi_trip_dlt

          sql_task:
            file:
              path: ../src/sql/05_analytics/taxi_demand.sql
            warehouse_id: 8414776a94d0039f


        - task_key: weather_demand_trip_behavior

          depends_on:
            - task_key: fact_taxi_trip_dlt

          sql_task:
            file:
              path: ../src/sql/05_analytics/weather_demand_trip_behavior.sql
            warehouse_id: 8414776a94d0039f


        - task_key: strongest_mobility_patterns

          depends_on:
            - task_key: fact_taxi_trip_dlt

          sql_task:
            file:
              path: ../src/sql/05_analytics/strongest_mobility_patterns.sql
            warehouse_id: 8414776a94d0039f


        # ==========================================
        # 02/03 - WEATHER (dlt-based ingestion)
        # Replaces the original download_open_meteo/ingest_open_meteo/
        # clean_weather/dim_weather chain. Feeds fact_taxi_trip via dim_weather_dlt.
        #
        # dlt_ingest_weather runs OUTSIDE this job, as a GitHub Actions step
        # (.github/workflows/ci-cd.yml, "Ingest Open-Meteo weather data (dlt)")
        # — Databricks Free Edition serverless compute blocks the network call
        # dlt needs for its staging upload, confirmed across multiple
        # workspaces/execution contexts. GitHub Actions has normal network
        # access, so it runs there instead and populates weather_bronze_dlt
        # before this job runs.
        # ==========================================

        - task_key: clean_weather_dlt

          depends_on:
            - task_key: init_schemas

          sql_task:
            file:
              path: ../src/sql/02_silver_clean/clean_weather_dlt.sql
            warehouse_id: 8414776a94d0039f


        - task_key: dim_weather_dlt

          depends_on:
            - task_key: check_weather

          sql_task:
            file:
              path: ../src/sql/03_gold_model/dim_weather_dlt.sql
            warehouse_id: 8414776a94d0039f
